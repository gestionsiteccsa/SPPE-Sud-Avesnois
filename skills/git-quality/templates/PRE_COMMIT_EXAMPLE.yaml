# Exemple de base pre-commit
# Adapter les versions et hooks au projet réellement utilisé.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "<PINNED_VERSION>"
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "<PINNED_VERSION>"
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

# Ajouter un secret scanner dédié si le projet le retient.
