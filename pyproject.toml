[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Sélection explicite : erreurs pycodestyle critiques (E4/E7/E9) + Pyflakes (F).
# Les règles de style (tri d'imports, formatage) et les règles dédiées aux
# idiomes Django (valeurs mutables de classes, dates) sont laissées de côté
# pour ne pas imposer un reformatage du code existant.
select = ["E4", "E7", "E9", "F"]
