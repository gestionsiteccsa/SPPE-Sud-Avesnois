{% extends "base.html" %}
{% load static %}

{% block title %}Mot de passe réinitialisé — SPPE Sud-Avesnois{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-var(--header-h)-var(--header-h))] grid grid-cols-1 lg:grid-cols-2 items-center">
  <div class="hidden lg:flex lg:items-center lg:justify-center bg-[linear-gradient(135deg,var(--color-primary-soft)_0%,var(--color-accent-soft)_100%)] p-8" aria-hidden="true">
    <div class="max-w-[28rem] text-center">
      <img src="{% static 'img/hero.svg' %}" alt="" width="320" height="280" loading="eager">
      <p class="font-display text-[length:var(--fs-2xl)] font-bold mt-5 mb-3 text-[var(--color-text)]">C'est fait&nbsp;!</p>
    </div>
  </div>

  <section class="px-4 py-9 lg:px-8 lg:py-10" aria-labelledby="complete-title">
    <div class="max-w-[var(--container-narrow)] mx-auto">
      <div class="flex flex-col items-center gap-3 p-6 rounded-[var(--radius-lg)] bg-[var(--color-success-soft)] border border-[var(--color-success)] mb-6 text-center">
        <svg class="w-6 h-6 shrink-0" aria-hidden="true" width="24" height="24"><use href="{% static 'img/icons.svg' %}#i-check"></use></svg>
        <div>
          <h1 id="complete-title" class="text-[length:var(--fs-xl)] m-0 mb-1">Mot de passe réinitialisé</h1>
          <p>Votre mot de passe a été modifié avec succès.</p>
        </div>
      </div>

      <p class="text-center text-[length:var(--fs-sm)] text-[var(--color-text-muted)] mt-5">
        <a class="inline-flex items-center justify-center gap-2 min-h-[2.75rem] px-5 py-3 rounded-[var(--radius-md)] font-semibold text-[length:var(--fs-sm)] no-underline cursor-pointer border transition-all whitespace-nowrap select-none hover:no-underline active:translate-y-px disabled:opacity-55 disabled:cursor-not-allowed disabled:pointer-events-none bg-[var(--color-primary)] text-white border-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] hover:border-[var(--color-primary-hover)]" href="{% url 'login' %}">
          <svg class="w-[1.1rem] h-[1.1rem] shrink-0" aria-hidden="true"><use href="{% static 'img/icons.svg' %}#i-key"></use></svg>
          Se connecter
        </a>
      </p>
    </div>
  </section>
</div>
{% endblock %}
